
<!DOCTYPE html>
<html>
<head>
    <title>My Random Page</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-4">

    <h1 class="text-center text-primary">Welcome to My Random Page</h1>

    <p class="text-center">This is a simple webpage using Bootstrap.</p>

    <h2>My Favorite Things</h2>

    <ul class="list-group mb-4">
        <li class="list-group-item">Programming</li>
        <li class="list-group-item">Music</li>
        <li class="list-group-item">Traveling</li>
        <li class="list-group-item">Gaming</li>
    </ul>

    <h2>My Daily Routine</h2>

    <ol>
        <li>Wake up</li>
        <li>Attend classes</li>
        <li>Study programming</li>
        <li>Relax</li>
    </ol>

    <h2>Contact Me</h2>

    <form>
        <div class="mb-3">
            <label for="name" class="form-label">Name:</label>
            <input type="text" id="name" class="form-control">
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email:</label>
            <input type="email" id="email" class="form-control">
        </div>

        <div class="mb-3">
            <label for="message" class="form-label">Message:</label>
            <textarea id="message" class="form-control"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Submit</button>
    </form>

    <hr>

    <p>Thank you for visiting my webpage!</p>

</body>
</html>
